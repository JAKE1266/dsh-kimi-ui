# dsh-kimi-ui — DSH bundle patch（挂载声明）
#
# 让本包成为 PROFILE LAYER 而不是「装了却什么都不做的依赖」：当执行
# `dsh plugin --profile <profile> add dsh-kimi-ui` 时，DSH 会把带
# `dsh.bundle.patch` 的依赖并入层栈，本 insert 行把插件挂到 profile 上。
#
# 停用 / 卸载后，皮肤样式由客户端的 ctx.effect 卸载函数回收，
# 官方界面自动恢复，无需手工清理配置。
#
# 安装（GitHub）：
#   dsh plugin --profile desktop add github:JAKE1266/dsh-kimi-ui
# 安装（本地源码）：
#   dsh plugin --profile desktop add link:<本目录绝对路径>
- insert:
    - id: dsh-kimi-ui
      name: 'dsh-kimi-ui'
