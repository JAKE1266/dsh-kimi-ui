name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 鏈寘闆朵緷璧栵紝涓嶉渶瑕?npm install銆傛瀯寤轰骇鐗╅殢浠撳簱鎻愪氦锛屽洜姝?CI 瑕?      # 楠岃瘉銆岄噸鏂版瀯寤轰笉浜х敓宸紓銆嶁€斺€旈槻姝㈡湁浜烘敼浜?src 鍗村繕浜嗚窇 build銆?      - name: Build
        run: node scripts/build.mjs

      - name: Build output is committed
        run: git diff --exit-code -- client/client.js

      # 15 椤规鏌ワ細浜х墿璇硶/宸ュ巶濂戠害銆? 妯″潡鍐呰仈銆佸弻涓婚 CSS銆?      # 浜殫閿泦鍚堜竴鑷存€с€佹牱寮忓箓绛変笌鍥炴敹銆乤pply 瀹归敊銆佺粍浠跺眰鎻掓Ы涓?      # React 缂哄け闄嶇骇銆佺粍浠舵牱寮忓洖鏀躲€乵anifest 鑷唇銆?      - name: Verify
        run: node test/run-all.mjs

      - name: Manifest sanity
        run: node -e "const p=require('./package.json'); if(p.name!=='dsh-kimi-ui') throw new Error('bad name'); if(p.dsh.client.platform!=='web') throw new Error('bad platform'); console.log('manifest ok:', p.name, p.version)"
